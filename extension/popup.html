<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Live Translator</title>
  <style>
    /* Color tokens and typography (light-first, dark adapted via prefers-color-scheme) */
    :root {
      --bg: #eef1f4;
      --surface: #ffffff;
      --surface-2: #f5f7f9;
      --border: #dbe0e6;
      --text: #1b1f27;
      --text-muted: #667085;
      --text-faint: #9aa2b1;
      --accent: #b9750f;
      --accent-soft: #f2e3cd;
      --ok: #2f8f5f;
      --risk: #c23f30;
      --music: #8452c9;
      --shadow: 0 1px 2px rgba(20, 23, 28, 0.06), 0 8px 24px rgba(20, 23, 28, 0.08);
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic",
        "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      --mono: ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      /* Guarded so an explicit manual "light" choice (data-theme) wins over
         the OS setting; see the matching :root[data-theme="dark"] block
         below for the manual "dark" direction. */
      :root:not([data-theme="light"]) {
        --bg: #14171c;
        --surface: #1c2029;
        --surface-2: #20242e;
        --border: #2a2f3a;
        --text: #eef0f3;
        --text-muted: #8b93a3;
        --text-faint: #5b6270;
        --accent: #e8a33d;
        --accent-soft: #3a2f1c;
        --ok: #4caf7d;
        --risk: #e2685a;
        --music: #a687e0;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 32px rgba(0, 0, 0, 0.35);
      }
    }
    :root[data-theme="dark"] {
      --bg: #14171c;
      --surface: #1c2029;
      --surface-2: #20242e;
      --border: #2a2f3a;
      --text: #eef0f3;
      --text-muted: #8b93a3;
      --text-faint: #5b6270;
      --accent: #e8a33d;
      --accent-soft: #3a2f1c;
      --ok: #4caf7d;
      --risk: #e2685a;
      --music: #a687e0;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 32px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header.bar {
      flex: none;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .capture-btn {
      display: inline-flex;
      align-items: center;
      flex: none;
      border: 1px solid var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
      font: inherit;
      padding: 7px;
      border-radius: 8px;
      cursor: pointer;
    }
    /* Icon-only button: the label stays in the DOM as the button's accessible
       name but is visually hidden to give the 방송 제목 line more header width. */
    #captureLabel {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
    .capture-btn svg {
      width: 14px;
      height: 14px;
      flex: none;
      display: block;
    }
    .capture-btn .icon-pause { display: none; }
    .capture-btn.recording {
      background: var(--risk);
      border-color: var(--risk);
      color: #fff;
    }
    .capture-btn.recording .icon-record { display: none; }
    .capture-btn.recording .icon-pause { display: block; }

    .status-text {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: flex-start;
      gap: 6px;
      overflow: hidden;
    }
    .status-lines {
      display: flex;
      flex-direction: column;
      min-width: 0;
      line-height: 1.3;
    }
    /* DOM order in .status-lines is 방송 제목 (primary, big) then the
       capture-state word (secondary, small) — swapped 2026-08-29. */
    .status-detail {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status-detail:empty { display: none; }
    .status-state {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status-detail.hint {
      color: var(--accent);
      font-weight: 700;
      animation: hint-pulse 1s ease-in-out 2;
    }
    @keyframes hint-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    @media (prefers-reduced-motion: reduce) {
      .status-detail.hint { animation: none; }
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--risk);
      flex: none;
      margin-top: 5px;
      animation: pulse 1.6s ease-in-out infinite;
    }
    .live-dot.off {
      background: var(--text-faint);
      animation: none;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    @media (prefers-reduced-motion: reduce) {
      .live-dot { animation: none; }
    }

    .debug-toggle {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--text-faint);
      cursor: pointer;
      user-select: none;
      flex: none;
    }
    .debug-toggle input {
      accent-color: var(--accent);
      width: 13px;
      height: 13px;
    }

    .theme-toggle-btn {
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1;
      cursor: pointer;
    }
    .theme-toggle-btn:hover { background: var(--border); }
    .theme-toggle-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

    .log-card {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 12px 14px 4px;
      overflow: hidden;
    }

    .scroll-to-bottom-btn {
      position: absolute;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      display: none;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text-muted);
      box-shadow: var(--shadow);
      cursor: pointer;
      z-index: 1;
    }
    .scroll-to-bottom-btn.visible { display: flex; }
    .scroll-to-bottom-btn:hover { color: var(--text); background: var(--surface-2); }
    .scroll-to-bottom-btn svg { width: 14px; height: 14px; display: block; }

    .eyebrow {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-faint);
      margin: 0 0 8px;
      flex: none;
    }

    #log {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 8px;
      scrollbar-color: var(--text-faint) transparent;
      scrollbar-width: thin;
    }
    #log::-webkit-scrollbar { width: 8px; }
    #log::-webkit-scrollbar-track { background: transparent; }
    #log::-webkit-scrollbar-thumb {
      background: var(--text-faint);
      border-radius: 4px;
      border: 2px solid var(--bg);
      background-clip: padding-box;
    }
    #log::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    .segment {
      border-radius: 8px;
      padding: 8px 10px;
      border-left: 2px solid transparent;
      cursor: pointer;
    }
    .segment:hover { background: var(--surface-2); }
    .segment.flagged { background: color-mix(in srgb, var(--risk) 14%, var(--surface)); }

    .ja-line {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .ko-line {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.35;
    }

    .segment.is-partial {
      border-left-color: var(--text-faint);
    }
    .segment.is-partial .ja-line { color: var(--text-faint); }
    .segment.is-partial .ko-line {
      color: var(--text-faint);
      font-weight: 400;
      filter: blur(0.25px);
    }

    .segment.is-final {
      border-left-color: var(--accent);
    }
    .segment.is-final .ko-line { color: var(--text); }

    /* 노래/BGM 감지 세그먼트 (backend/music_gate.py::music_suspected) — 원문/
       번역 텍스트는 항상 그대로 보여주되(2026-08-25 popup.js 수정: 예전엔
       여기서 통째로 지워버리는 버그가 있었음), 노래 구간에서 나온 결과임을
       한눈에 구분할 수 있도록 --music 색상으로 칠한다. 디버그 모드에서는
       추가로 문구 라벨도 표시. */
    .segment.music-suspected {
      border-left-color: var(--music);
    }
    .segment.music-suspected .ja-line,
    .segment.music-suspected .ko-line {
      color: var(--music);
    }
    body.show-debug .segment.music-suspected .ko-line::before {
      content: "🎵 노래·배경음악 감지됨";
      color: var(--music);
      font-style: italic;
      font-weight: 400;
    }

    .conf-line {
      margin-top: 7px;
      display: none;
      flex-direction: column;
      gap: 4px;
    }
    body.show-debug .conf-line { display: flex; }

    /* First HISTORY_WARMUP_FINALS sentences of a session (popup.js) — no
       [PREVIOUS SENTENCE] context yet, so translation quality is rougher.
       Hidden by default, visible when 디버그 지표 is checked (same gate as
       .conf-line above). */
    body:not(.show-debug) .segment.warmup { display: none; }

    .metric-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--mono);
      font-size: 9px;
      color: var(--text-faint);
    }
    .metric-label {
      width: 84px;
      flex: none;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .metric-bar {
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: var(--surface-2);
      overflow: hidden;
    }
    .metric-fill { display: block; height: 100%; }
    .metric-fill.metric-ok { background: var(--ok); }
    .metric-fill.metric-risk { background: var(--risk); }

    .chat-card {
      flex: none;
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 12px 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-row {
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }
    .chat-row .chat-input { flex: 1; }

    .chat-input {
      width: 100%;
      resize: none;
      font: inherit;
      font-size: 13px;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      min-height: 42px;
    }
    .chat-input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .chat-send {
      flex: none;
      border: 0;
      background: var(--accent);
      color: #14171c;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      padding: 0 14px;
      border-radius: 8px;
      cursor: pointer;
      align-self: stretch;
    }
    .chat-send:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .chat-output {
      font-size: 13px;
      color: var(--text);
      background: var(--surface-2);
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
    }
    .chat-output:empty { display: none; }
    .chat-output.copied { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); }

    .chat-status {
      font-size: 10.5px;
      color: var(--text-faint);
    }

    .context-summary-bar {
      flex: none;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-2);
    }
    .context-summary {
      flex: 1;
      min-width: 0;
      color: var(--text-muted);
      font-size: 11.5px;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* Placeholder state (popup.js): backend starting up / summary not ready
       yet — dimmer and italic to read as status text, not a real summary. */
    .context-summary.placeholder {
      color: var(--text-faint);
      font-style: italic;
    }

    /* 노래/배경음악 감지 상태 표시 (2026-08-25) — 최신 final의
       music_suspected를 그대로 반영. 꺼져있을 땐 흐리고 정적, 감지되면
       또렷해지며 살짝 펄스 애니메이션 (live-dot과 같은 패턴). */
    .music-indicator {
      flex: none;
      font-size: 13px;
      line-height: 1;
      opacity: 0.32;
      filter: grayscale(1);
      transition: opacity 0.3s ease, filter 0.3s ease;
    }
    .music-indicator.active {
      opacity: 1;
      filter: none;
      animation: music-indicator-pulse 1.4s ease-in-out infinite;
    }
    @keyframes music-indicator-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.18); opacity: 0.65; }
    }
    @media (prefers-reduced-motion: reduce) {
      .music-indicator.active { animation: none; }
    }

    /* 영상 메타데이터 — 채널명(1행, 길면 marquee) / 방송 시작 경과시간(2행).
       2026-08-29: 디버그 모드 전용에서 일반 모드에도 항상 노출로 변경. 채널·
       시간이 모두 없을 때만 popup.js가 [hidden]을 건다. */
    .video-meta {
      flex: none;
      display: flex;
      flex-direction: column;
      gap: 1px;
      padding: 6px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-2);
      font-family: var(--mono);
    }
    .video-meta[hidden] { display: none; }
    .video-meta-channel {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .video-meta-time {
      font-size: 10px;
      color: var(--text-faint);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Shared marquee (context summary · 방송 제목 · 채널명): popup.js's
       renderMaybeMarquee() adds .marquee to the container and fills it with a
       .marquee-track holding two identical copies back-to-back, scrolled left
       by exactly one copy's width (-50%) so the loop is seamless. */
    .marquee-track {
      display: inline-flex;
      width: max-content;
    }
    .marquee-track span {
      padding-right: 40px;
      white-space: nowrap;
    }
    .marquee {
      text-overflow: clip;
    }
    .marquee .marquee-track {
      animation-name: marquee-scroll;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }
    @keyframes marquee-scroll {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .marquee .marquee-track { animation: none; }
    }

    .volume-bar-track {
      flex: none;
      height: 3px;
      background: var(--surface-2);
      overflow: hidden;
    }
    .volume-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      /* No CSS transition — popup.js drives this every animation frame via
         a requestAnimationFrame lerp, which reads smoother than a fixed-
         duration CSS transition re-triggered on each ~200ms sample. */
    }
  </style>
</head>
<body>
  <header class="bar">
    <button id="toggle" class="capture-btn" type="button">
      <svg class="icon-record" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <circle cx="8" cy="8" r="6" />
      </svg>
      <svg class="icon-pause" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <rect x="3.5" y="2.5" width="3.2" height="11" rx="1" />
        <rect x="9.3" y="2.5" width="3.2" height="11" rx="1" />
      </svg>
      <span id="captureLabel">캡처 시작</span>
    </button>
    <span class="status-text">
      <span class="live-dot off" id="liveDot"></span>
      <span class="status-lines">
        <span class="status-detail" id="statusDetail"></span>
        <span class="status-state" id="statusState">대기 중</span>
      </span>
    </span>
    <label class="debug-toggle">
      <input type="checkbox" id="debugToggle" />
      디버그 지표
    </label>
    <button id="themeToggle" class="theme-toggle-btn" type="button" aria-label="테마 전환">☀️</button>
  </header>

  <div class="volume-bar-track" role="presentation">
    <div id="volumeBarFill" class="volume-bar-fill"></div>
  </div>

  <div id="videoMeta" class="video-meta" hidden>
    <div id="videoMetaChannel" class="video-meta-channel"></div>
    <div id="videoMetaTime" class="video-meta-time"></div>
  </div>
  <div class="context-summary-bar">
    <div id="contextSummary" class="context-summary" title=""></div>
    <span id="musicIndicator" class="music-indicator" title="노래·배경음악 감지 안 됨">🎵</span>
  </div>

  <div class="log-card">
    <p class="eyebrow">실시간 전사 · 번역</p>
    <div id="log"></div>
    <button id="scrollToBottomBtn" class="scroll-to-bottom-btn" type="button" aria-label="맨 아래로 스크롤">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 6l5 5 5-5" />
      </svg>
    </button>
  </div>

  <div class="chat-card">
    <p class="eyebrow">채팅 답장 초안 · 한국어 → 일본어</p>
    <div class="chat-row">
      <textarea id="chatInput" class="chat-input" placeholder="방송에 보낼 한국어 채팅을 입력하세요"></textarea>
      <button id="chatTranslateBtn" class="chat-send" type="button">번역</button>
    </div>
    <div id="chatOutput" class="chat-output"></div>
    <div id="chatStatus" class="chat-status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
