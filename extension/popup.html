<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Live Translator</title>
  <style>
    body {
      width: 360px;
      font-family: system-ui, sans-serif;
      padding: 12px;
    }
    button {
      width: 100%;
      padding: 8px;
      font-size: 14px;
      cursor: pointer;
    }
    #status {
      margin: 8px 0;
      font-size: 12px;
      color: #666;
    }
    #log {
      height: 280px;
      overflow-y: auto;
      border: 1px solid #ddd;
      padding: 6px;
      font-size: 12px;
      white-space: pre-wrap;
    }
    #log > div {
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }
    #log > div:hover { background: #f5f5f5; }
    #log > div.flagged, #log > div.flagged:hover { background: #ffd6e7; }
    .ja-line { font-size: 11px; }
    .ko-line { font-size: 14px; margin-top: 2px; }
    .partial { color: #999; filter: blur(0.2px); }
    .final { color: #111; font-weight: 600; }
    .ko-line.partial { color: #aaa; }
    .ko-line.final { color: #0a3; }
    .conf-line { margin-top: 3px; }
    .metric-row { display: flex; align-items: center; gap: 4px; font-size: 9px; color: #777; font-family: monospace; }
    .metric-label { width: 78px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .metric-bar { flex: 1; height: 5px; background: #eee; border-radius: 2px; overflow: hidden; }
    .metric-fill { display: block; height: 100%; }
    .metric-fill.metric-ok { background: #4caf50; }
    .metric-fill.metric-risk { background: #e53935; }
    #chatReply {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #ddd;
    }
    #chatReply h2 {
      font-size: 11px;
      font-weight: 700;
      color: #666;
      margin: 0 0 6px;
    }
    #chatInput {
      width: 100%;
      box-sizing: border-box;
      resize: vertical;
      font-family: inherit;
      font-size: 13px;
      padding: 6px;
      min-height: 44px;
    }
    #chatTranslateBtn {
      margin-top: 6px;
    }
    #chatOutput {
      margin-top: 6px;
      min-height: 20px;
      padding: 6px;
      font-size: 13px;
      background: #f5f5f5;
      border-radius: 3px;
      cursor: pointer;
      white-space: pre-wrap;
    }
    #chatOutput:empty { display: none; }
    #chatOutput.copied { background: #d6f5df; }
    #chatStatus {
      margin-top: 4px;
      font-size: 11px;
      color: #999;
    }
  </style>
</head>
<body>
  <button id="toggle">Start Capture</button>
  <div id="status">idle</div>
  <div id="log"></div>
  <div id="chatReply">
    <h2>내 채팅 번역 (한국어 → 일본어, 초안)</h2>
    <textarea id="chatInput" placeholder="방송에 보낼 한국어 채팅을 입력하세요"></textarea>
    <button id="chatTranslateBtn">번역</button>
    <div id="chatOutput"></div>
    <div id="chatStatus"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
