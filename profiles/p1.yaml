# P1: 일반 사무용 노트북 (Intel iGPU + i5급, dGPU 없음).
#
# !! 모든 값은 초기 가설이다. 평가 세션(docs/planning/HARDWARE_PROFILES.md §8)에서 확정한다. !!
#
# 가정 / 미확인 사항:
# - iGPU(Vulkan) 에서 whisper.cpp 는 CPU 대비 3~4배 빠르다는 보고가 있으나(Phoronix, whisper.cpp 1.8.3),
#   turbo+양자화 기준 실측이 아니다. Intel iGPU 에서 llama.cpp Vulkan 은 AMD 대비 성능이 낮다는 vendor 보고가 있다.
#   -> CPU 전용(llama: -ngl 0 / whisper: CPU 빌드) 대안과 반드시 비교 측정할 것.
# - STT 와 번역이 같은 iGPU/RAM 대역폭을 공유하며 직렬 처리된다(커밋 806585b) -> 지연이 합산된다.
# - i5 노트북 메모리 대역폭 40~60GB/s 추정 -> 4B Q4(약 2.5GB) 이론 상한 16~24 tok/s, 실측 50~80% (추정, 측정 필요).
# - gemma-3-4b-it 은 현행 12B 대비 번역 품질 **미검증**. 평가 L1 비열등성 판정에서 불합격이면 이 번들은 탈락.
# - 지연 2초 목표는 미달 가능성이 높다. 정책(HARDWARE_PROFILES.md §1-2)상 지연은 실측 후 사후 결정하며
#   번역은 끝까지 수행한다(타임아웃 폴백은 측정 시 _measure 오버레이로 해제).
# - Vulkan 빌드 바이너리 디렉터리(llama-server-vulkan/, whisper-server-vulkan/)는 저장소에 없다.
#   평가 전에 준비해야 한다. 모델 파일(backend/models/)도 별도 다운로드 필요.
# - RAM 16GB 듀얼채널 권장 (iGPU 는 시스템 RAM 을 공유하므로 vram_budget_gb 는 0).
name: p1
description: Intel iGPU + i5급 노트북 — whisper.cpp(Vulkan) turbo 양자화 + gemma-3-4b-it Q4_K_M(Vulkan), torch-free
vram_budget_gb: 0       # 전용 VRAM 없음 — iGPU 는 시스템 RAM 공유 (RAM 16GB, 듀얼채널 권장)
config:
  STT_ENGINE: whisper-cpp
  WHISPER_CPP_FAST_URL: "http://127.0.0.1:8081"
  VAD_BACKEND: onnx
  HALLUCINATION_GATE_BACKEND: onnx
  PARTIAL_UPDATE_INTERVAL_S: 1.2   # 초기 가설. 기본 0.6 대비 늘려 iGPU 부하 완화 목적 — 측정 후 확정
llama_server:
  exe: llama-server-vulkan/llama-server.exe   # 가설: Vulkan 빌드. CPU 대안과 비교 필요 (-ngl 0 로 전환)
  model: backend/models/google_gemma-3-4b-it-Q4_K_M.gguf
  port: 8080
  args: ["-ngl","999","-c","2048","-np","1","-t","4"]   # -t 4: i5 물리 코어 가정(추정). -c 2048: 번역 1문장 기준 가설
whisper_server:
  exe: whisper-server-vulkan/whisper-server.exe   # 가설: Vulkan 빌드. CPU 대안과 비교 필요
  model: backend/models/ggml-large-v3-turbo-q5_0.bin
  port: 8081
  args: ["-l","ja","-bs","5","-t","4"]   # -bs 5: final 기준. partial 용 -bs 1 서버 분리 여부는 평가에서 결정
