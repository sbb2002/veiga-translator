# P2 번들 — GTX 1050 Ti 4GB (Pascal). 모든 값은 **초기 가설**이며 평가 세션(HARDWARE_PROFILES.md §8)에서 확정한다.
#
# 근거와 미검증 사항:
# - Pascal(sm_61)은 CUDA 13 / 최신 PyTorch 미지원. 그래서 torch·CTranslate2 대신
#   whisper.cpp(whisper-server) + llama.cpp(llama-server)를 쓰고, 두 바이너리는 CUDA 12.x 빌드 또는
#   Vulkan 빌드여야 한다. 해당 바이너리가 sm_61 을 포함하는지는 빌드 확인 필요(미검증).
# - GTX 1050 Ti 는 FP16 이 FP32 의 1/64 라 fp16 경로(int8_float16, Qwen3-ASR fp16 등)는 부적합.
#   그래서 양자화(q5_0) ggml 모델을 쓴다.
# - VRAM 예산 4GB: gemma-3-4b Q4_K_M ≈ 2.5GB 라 전부 올리면 whisper 와 합쳐 초과.
#   `-ngl 26` 부분 오프로드는 가설이며, whisper turbo q5_0 ≈ 0.6~1.2GB 와 합산해 맞춘다.
#   `llama-bench -ngl` 스윕으로 확정한다(미확정).
# - 4B 는 현행 12B 대비 번역 품질이 **미검증**(일·한 직접 비교 자료 없음). 평가 L1 에서 비열등성 판정,
#   불합격이면 이 번들은 탈락(HARDWARE_PROFILES.md §8.3).
# - whisper-server 의 `-bs 5` 는 서버 시작 시 beam 이므로 fast(partial)·final 모두에 적용된다
#   (요청별 beam_size 지원 여부는 미확인). 필요 시 WHISPER_CPP_FINAL_URL 에 -bs 5 서버를 별도로 지정한다.
#   (현재 config 에는 FINAL_URL 을 두지 않음 — 미확정 가설)
# - PARTIAL_UPDATE_INTERVAL_S 1.0 은 partial 전사 부하를 줄이기 위한 초기값(미확정).
name: p2
description: GTX 1050 Ti 4GB (Pascal) — whisper.cpp turbo(양자화) + gemma-3-4b-it Q4_K_M 일부 GPU, torch-free
vram_budget_gb: 4
config:
  STT_ENGINE: whisper-cpp
  WHISPER_CPP_FAST_URL: "http://127.0.0.1:8081"
  VAD_BACKEND: onnx
  HALLUCINATION_GATE_BACKEND: onnx
  PARTIAL_UPDATE_INTERVAL_S: 1.0
llama_server:
  exe: llama-server/llama-server.exe
  model: backend/models/google_gemma-3-4b-it-Q4_K_M.gguf
  port: 8080
  # -ngl 26: 부분 오프로드 가설(VRAM 4GB 예산 맞추기). llama-bench -ngl 스윕으로 확정 예정.
  # -c 2048 / -np 1: 단일 스트림, 짧은 컨텍스트. -fa on + q8_0 KV: VRAM 절감.
  args: ["-ngl","26","-c","2048","-np","1","-fa","on","-ctk","q8_0","-ctv","q8_0"]
whisper_server:
  exe: whisper-server/whisper-server.exe
  model: backend/models/ggml-large-v3-turbo-q5_0.bin
  port: 8081
  # -bs 5: 서버 시작 시 beam(fast·final 공통 적용). -l ja: 일본어 고정.
  args: ["-l","ja","-bs","5"]
