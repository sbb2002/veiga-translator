# P2.5 — VRAM 8GB (RTX 4060 Laptop / RTX 3060 Ti 등)
#
# 모든 값은 초기 가설이며 평가 세션에서 확정한다 (docs/planning/HARDWARE_PROFILES.md §8).
# 번들 구성과 검증 항목은 profiles/p25.md 참고.
#
# 12B Q4_K_M(약 7.2~7.5GB)은 8GB 에 STT·CUDA 컨텍스트·KV 캐시와 함께 전부 올라가지 않으므로
# llama-server 의 `-ngl` 로 일부 레이어만 GPU 에 올리고 나머지는 CPU 에서 돌린다.
# `-ngl 34` 는 가설 값이다. 평가 세션에서 `llama-bench -ngl 0,10,20,30,34,40,99` 로 스윕해
# VRAM 피크 8GB 이내 최대값을 찾는다. 분할 시 generation tok/s 하락이 지연에 미치는 영향은 L3 에서 실측한다.
#
# 대안 후보 (미검증):
#   - gemma-3-12b Q4_K_S (더 작은 양자화 — 전부 적재 가능한지 확인 필요, 품질 하락 측정 필요)
#   - TranslateGemma-12B (GBNF 그래머/프롬프트 호환 확인 필요)
#
# STT/VAD/게이트는 torch 없이 동작한다 (requirements-lite.txt). 설치: pip install -r backend/requirements-lite.txt
name: p25
description: VRAM 8GB — turbo(faster-whisper) + gemma-3-12b Q4_K_M 일부 레이어 CPU 분할, torch-free
vram_budget_gb: 8
config:
  STT_ENGINE: faster-whisper          # 초기 가설. 평가로 확정
  WHISPER_MODEL_SIZE: large-v3-turbo  # 초기 가설. 평가로 확정
  WHISPER_COMPUTE_TYPE: int8_float16  # 초기 가설. 8GB 에서 VRAM 피크 측정 후 확정
  VAD_BACKEND: onnx                   # torch 제거 (requirements-lite.txt 전제)
  HALLUCINATION_GATE_BACKEND: onnx    # torch 제거 (requirements-lite.txt 전제)
llama_server:
  exe: llama-server/llama-server.exe
  model: backend/models/google_gemma-3-12b-it-Q4_K_M.gguf
  port: 8080
  # -ngl 34: 가설 (평가 세션에서 VRAM 8GB 이내 최대값으로 확정)
  # -c 4096: 컨텍스트 축소 (KV 캐시 VRAM 절감). -ctk/-ctv q8_0: KV 캐시 양자화
  args: ["-ngl","34","-c","4096","-np","1","-fa","on","-ctk","q8_0","-ctv","q8_0"]
