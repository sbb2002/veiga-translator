# P3 번들 — 모든 값은 초기 가설이며 평가 세션(docs/planning/HARDWARE_PROFILES.md §8)에서 확정한다.
#
# 예산 근거 (추정, 미측정): 12B Q4_K_M 가중치 약 7.2~7.5GB + KV(c=4096, q8_0) + turbo int8 약 1.5GB ≈ 9.5GB 로 빠듯함.
# Qwen3-ASR 1.7B(≈4GB)는 동시 적재가 불가하므로 turbo 를 사용한다. 품질은 150쌍 평가에서 통계적 동률
# (docs/planning/HARDWARE_PROFILES.md §4-1).
# 컨텍스트 4096 이 기존 프롬프트·_final_history 에 충분한지는 평가에서 확인한다.
name: p3
description: RTX 3080급 (10GB) — turbo(faster-whisper) + gemma-3-12b Q4_K_M 전부 GPU, torch-free
vram_budget_gb: 10  # 정보용 (초기 가설)
config:
  STT_ENGINE: faster-whisper
  WHISPER_MODEL_SIZE: large-v3-turbo
  WHISPER_COMPUTE_TYPE: int8_float16
  VAD_BACKEND: onnx
  HALLUCINATION_GATE_BACKEND: onnx
llama_server:
  # 아래 args 는 모두 초기 가설: -c 4096 (컨텍스트), -ctk/-ctv q8_0 (KV 양자화) 는 평가에서 확정
  exe: llama-server/llama-server.exe
  model: backend/models/google_gemma-3-12b-it-Q4_K_M.gguf
  port: 8080
  args: ["-ngl","999","-c","4096","-np","1","-fa","on","-ctk","q8_0","-ctv","q8_0"]
